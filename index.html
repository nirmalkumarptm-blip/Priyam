<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PRIYAM — The Soul of South Indian Cooking</title>
  <meta name="description" content="PRIYAM: step-by-step South Indian recipes from Tamil Nadu, Kerala, Andhra Pradesh, Telangana, Hyderabad and Karnataka, in English, Tamil, Malayalam, Kannada, Telugu and Hindi.">
  <meta name="theme-color" content="#641E25">
  <link rel="icon" type="image/png" href="Images/logo.png">
  <!-- Latin typefaces (progressive enhancement; system fonts are the fallback).
       Script-specific Noto fonts are loaded on demand by script.js. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Hind:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#app" id="skip-link">Skip to content</a>
  <header class="site-header" id="site-header"></header>
  <main id="app" tabindex="-1">
    <p class="boot">Loading recipes…</p>
    <noscript><p class="boot">PRIYAM needs JavaScript to show recipes. Please enable JavaScript in your browser.</p></noscript>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <div class="timers-root" id="timers-root"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div id="sheet-root"></div>

  <!-- Icon + art sprite (inline: no extra network requests) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.5l6.8-4M8.6 13.5l6.8 4"/></symbol>
    <symbol id="i-print" viewBox="0 0 24 24"><path d="M7 9V3h10v6M7 17H4v-7h16v7h-3M7 14h10v7H7z"/></symbol>
    <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-dice" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9h.01M15 9h.01M9 15h.01M15 15h.01M12 12h.01"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.6-5.9M4 4v5h5"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-5 1-9z"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></symbol>

    <!-- Illustrated fallbacks for dishes without photographs -->
    <symbol id="art-pot" viewBox="0 0 100 100">
      <path d="M44 22c-6-5 0-9-1-14M52 24c-6-5 0-9-1-14M60 22c-6-5 0-9-1-14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" opacity=".8"/>
      <rect x="34" y="34" width="32" height="7" rx="3.5" fill="currentColor"/>
      <path d="M36 41c-14 6-20 22-14 34 5 11 18 15 28 15s23-4 28-15c6-12 0-28-14-34z" fill="currentColor" opacity=".92"/>
      <path d="M30 60c6 4 14 6 20 6s14-2 20-6" fill="none" stroke="#35251E" stroke-width="1.6" opacity=".35"/>
    </symbol>
    <symbol id="art-bowl" viewBox="0 0 100 100">
      <path d="M40 30c-5-4 0-8-1-12M50 32c-5-4 0-8-1-12M60 30c-5-4 0-8-1-12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" opacity=".8"/>
      <path d="M12 46h76c0 22-14 38-38 38S12 68 12 46z" fill="currentColor" opacity=".92"/>
      <rect x="30" y="86" width="40" height="5" rx="2.5" fill="currentColor"/>
      <path d="M20 54h60" stroke="#35251E" stroke-width="1.6" opacity=".3"/>
    </symbol>
    <symbol id="art-sweet" viewBox="0 0 100 100">
      <rect x="14" y="58" width="72" height="8" rx="3" fill="currentColor"/>
      <path d="M22 58l8-20h40l8 20z" fill="currentColor" opacity=".92"/>
      <path d="M36 58l5-12M50 58V46M64 58l-5-12" stroke="#35251E" stroke-width="1.6" opacity=".3" fill="none"/>
      <circle cx="50" cy="26" r="6" fill="currentColor" opacity=".8"/>
    </symbol>
  </svg>

  <script src="meta.js"></script>
  <script src="translations.js"></script>
  <script src="recipes.js"></script>
  <script src="recipe-translations.js"></script>
  <script src="script.js"></script>
</body>
</html>
